name: Update SoundCloud Tracks

on:
  # Run manually from Actions tab
  workflow_dispatch:

  # Run on schedule (e.g., daily at 6 AM UTC)
  schedule:
    - cron: '0 6,18 * * *'

  # Run when pushing to main branch (optional)
  # push:
  #   branches:
  #     - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-tracks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Generate tracks JSON
        env:
          SOUNDCLOUD_CLIENT_ID: ${{ secrets.SOUNDCLOUD_CLIENT_ID }}
          SOUNDCLOUD_CLIENT_SECRET: ${{ secrets.SOUNDCLOUD_CLIENT_SECRET }}
          SOUNDCLOUD_USERNAME: ${{ secrets.SOUNDCLOUD_USERNAME }}
          TRACK_LIMIT: 6
          OUTPUT_FILE: tracks.json
          # Embed customization (optional - uncomment and modify as needed)
          EMBED_COLOR: 65849f
          # EMBED_AUTO_PLAY: false
          EMBED_HIDE_RELATED: true
          # EMBED_SHOW_COMMENTS: true
          # EMBED_SHOW_USER: true
          # EMBED_SHOW_REPOSTS: false
          EMBED_SHOW_TEASER: false
        run: npm run generate

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # Compare content excluding generated_at timestamp
          OLD_CONTENT=$(git show HEAD:tracks.json 2>/dev/null | jq 'del(.generated_at)' 2>/dev/null || echo "{}")
          NEW_CONTENT=$(jq 'del(.generated_at)' tracks.json)

          if [ "$OLD_CONTENT" = "$NEW_CONTENT" ]; then
            echo "No meaningful changes in tracks.json (only generated_at differs)"
            git checkout tracks.json
          else
            echo "Tracks content has changed, committing..."
            git add tracks.json
            git commit -m "Update tracks.json [skip ci]" && git push
          fi
